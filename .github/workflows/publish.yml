name: Render and publish course site

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you trigger a rebuild by hand from the Actions tab

permissions:
  contents: write           # needed to push the built site to the gh-pages branch

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # No R or Python setup is needed: every .qmd in this project is static
      # markdown and raw HTML with no executable code chunks, so a render is
      # just Pandoc and takes well under a minute.
      - name: Render and publish to the gh-pages branch
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
